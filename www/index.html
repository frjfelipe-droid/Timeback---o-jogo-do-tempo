<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Volta no Tempo">
<title>Volta no Tempo</title>
<style>
/* VOICE: melancólico, cinematográfico, terno
   IDEA: um console portátil antigo que guarda uma história
   PICTURE: o próprio jogo, pixel art 320x180 ampliado
   COLOUR and TYPE: noite azul-violeta, âmbar do relógio; fonte bitmap própria
   LAYOUT: tela do jogo no topo, joystick e botões abaixo (retrato) ou nas laterais (paisagem) */
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07060c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#screen{position:relative;transition:width .2s,height .2s;background:#000;box-shadow:0 0 0 3px #1b1726,0 0 0 6px #0d0b14,0 20px 60px #000c}
#c{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#pad{display:none;position:relative;width:100%;flex:1;min-height:0}
.touch #pad{display:block}
.stick{position:absolute;width:132px;height:132px;border-radius:50%;
 background:radial-gradient(circle,#231d33 0 55%,#17131f 56%);box-shadow:inset 0 0 0 3px #322a47,0 0 0 3px #0c0a12}
.knob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;
 background:radial-gradient(circle at 40% 35%,#6c5f8f,#3a3152 60%,#262036);box-shadow:0 4px 0 #0c0a12,inset 0 0 0 2px #8a7cb0}
.btn{position:absolute;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 font:bold 18px/1 monospace;color:#f3e9d2;box-shadow:0 5px 0 #0c0a12,inset 0 0 0 3px #ffffff30;text-shadow:0 2px 0 #0008}
.btn.on{transform:translateY(3px);box-shadow:0 2px 0 #0c0a12,inset 0 0 0 3px #ffffff50}
#bA{background:radial-gradient(circle at 40% 35%,#e0705a,#a83a35)}
#bB{background:radial-gradient(circle at 40% 35%,#6b8fd6,#3b4f93)}
#bY{background:radial-gradient(circle at 40% 35%,#f2c45a,#b9822a);color:#2a1a08;text-shadow:none}
#bS{width:40px;height:30px;border-radius:9px;font-size:12px;background:#2a2438cc;letter-spacing:1px}
.hide{display:none!important}
.btn[data-l]::after{content:attr(data-l);position:absolute;top:100%;margin-top:7px;left:50%;transform:translateX(-50%);font:bold 10px monospace;color:#b8aac8;white-space:nowrap;text-shadow:0 1px 0 #000;letter-spacing:.5px}
#bS::after{display:none}
.btn,.stick{animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1)}}
.lbl{position:absolute;font:10px monospace;color:#8b80a8;text-align:center;width:80px;pointer-events:none}
/* paisagem no celular: controles flutuando sobre as laterais */
@media (orientation:landscape){
 .touch #wrap{flex-direction:row}
 .touch #pad{position:fixed;inset:0;pointer-events:none}
 .touch .stick,.touch .btn{pointer-events:auto;opacity:.72}
}
</style>
</head>
<body>
<div id="wrap">
 <div id="screen"><canvas id="c" width="320" height="180"></canvas></div>
 <div id="pad">
  <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
  <div class="btn" id="bY">Y</div>
  <div class="btn" id="bB">B</div>
  <div class="btn" id="bA">A</div>

{
// ================= FONTE BITMAP =================

a:'2:01110,00001,01111,10001,01111',b:'0:10000,10000,11110,10001,10001,10001,11110',

i:'0:1,0,1,1,1,1,1',j:'0:001,000,001,001,001,001,101,010',

m:'2:11010,10101,10101,10101,10101',n:'2:10110,11001,10001,10001,10001',

'0':'0:01110,10001,10011,10101,11001,10001,01110','1':'0:010,110,010,010,010,010,111',

'4':'0:00010,00110,01010,10010,11111,00010,00010','5':'0:11111,10000,11110,00001,00001,10001,01110',

'.':'6:1',',':'5:01,01,10','!':'0:1,1,1,1,1,0,1','?':'0:01110,10001,00001,00010,00100,00000,00100',
':':'2:1,0,0,0,1',';':'2:01,00,00,00,01,10','-':'4:111','(':'0:01,10,10,10,10,10,01',')':'0:10,01,01,01,01,01,10',
'"':'0:101,101',"'":'0:1,1','/':'0:00001,00010,00010,00100,01000,01000,10000',
'%':'0:11001,11010,00010,00100,01000,01011,10011','+':'2:000,010,111,010','*':'1:101,010,101',
'=':'3:111,000,111','>':'1:100,010,001,010,100','<':'1:001,010,100,010,001','_':'7:11111',
'[':'0:11,10,10,10,10,10,11',']':'0:11,01,01,01,01,01,11','#':'1:01010,11111,01010,11111,01010',
'♥':'1:01010,11111,11111,01110,00100','$':'0:00100,01111,10100,01110,00101,11110,00100',
'▼':'2:11111,01110,00100','▲':'2:00100,01110,11111','►':'0:1000,1100,1110,1111,1110,1100,1000','~':'2:01101,10110',
'²':'0:110,001,010,111','Δ':'0:00100,00100,01010,01010,10001,10001,11111','&':'0:01100,10010,10100,01000,10101,10010,01101',
'°':'0:010,101,010','ª':'0:011,101,011,000,111','º':'0:010,101,010,000,111','·':'3:1','—':'4:11111','™':'0:111,010','✓':'2:00001,00010,10100,01000'
};
const ACC = {acute:['01','10'],grave:['10','01'],circ:['010','101'],tilde:['01101','10110']};
const ACCMAP = {'á':['a','acute'],'à':['a','grave'],'â':['a','circ'],'ã':['a','tilde'],'é':['e','acute'],'ê':['e','circ'],
'í':['ı','acute'],'ó':['o','acute'],'ô':['o','circ'],'õ':['o','tilde'],'ú':['u','acute'],'ü':['u','circ'],
'Á':['A','acute'],'À':['A','grave'],'Â':['A','circ'],'Ã':['A','tilde'],'É':['E','acute'],'Ê':['E','circ'],'Í':['I','acute'],
'Ó':['O','acute'],'Ô':['O','circ'],'Õ':['O','tilde'],'Ú':['U','acute'],'ç':['c','ced'],'Ç':['C','ced']};
const GLYPH = {};
function buildGlyph(ch){
  if (GLYPH[ch]) return GLYPH[ch];
  let pix=[], w=3;
  if (ch===' ') { GLYPH[ch]={w:3,pix:[]}; return GLYPH[ch]; }
  const addSrc = (src)=>{ const [s,rows]=src.split(':'); const r=rows.split(','); const st=+s;
    r.forEach((row,ry)=>{ for(let x=0;x<row.length;x++) if(row[x]==='1') pix.push([x,st+ry]); }); return r[0].length; };
  if (ACCMAP[ch]) {
    const [base,acc]=ACCMAP[ch]; w = addSrc(FONT_SRC[base]);
    const upper = base===base.toUpperCase() && base!=='ı';
    if (acc==='ced'){ pix.push([Math.floor(w/2),7],[Math.floor(w/2)-1,8]); }
    else { const a=ACC[acc]; const aw=a[0].length; const ox=Math.ceil((w-aw)/2); const oy = upper?-3:-1;
      a.forEach((row,ry)=>{ for(let x=0;x<aw;x++) if(row[x]==='1') pix.push([ox+x,oy+ry]); }); }
  } else if (FONT_SRC[ch]) { w=addSrc(FONT_SRC[ch]); }
  else if (FONT_SRC[ch.normalize('NFD')[0]]) { return buildGlyph(ch.normalize('NFD')[0]); }
  else { w=3; pix=[[0,0],[1,0],[2,0],[2,1],[1,2],[1,4]]; }
  GLYPH[ch]={w,pix}; return GLYPH[ch];
}
const glyphCache = {};
function glyphImg(ch,color){
  const k=ch+'|'+color; if (glyphCache[k]) return glyphCache[k];
  const g=buildGlyph(ch); const cv=document.createElement('canvas'); cv.width=g.w+1; cv.height=13;
  const c=cv.getContext('2d'); c.fillStyle=color; g.pix.forEach(([x,y])=>c.fillRect(x,y+3,1,1));
  glyphCache[k]={cv,w:g.w}; return glyphCache[k];
}
function textW(str){ let w=0; for(const ch of str) w+=buildGlyph(ch).w+1; return w?w-1:0; }
// desenha texto; y = topo das maiúsculas
function text(c,str,x,y,color='#fff',shadow=null,scale=1){
  x=Math.round(x); y=Math.round(y);
  for(const ch of str){
    const g=glyphImg(ch,color);
    if (shadow){ const s=glyphImg(ch,shadow); c.drawImage(s.cv,x+scale,y-3*scale+scale,s.cv.width*scale,13*scale); }
    c.drawImage(g.cv,x,y-3*scale,g.cv.width*scale,13*scale);
    x+=(g.w+1)*scale;
  }
  return x;
}
function textC(c,str,cx,y,color,shadow,scale=1){ text(c,str,cx-textW(str)*scale/2,y,color,shadow,scale); }
function wrap(str,maxW){
  const out=[]; str.split('\n').forEach(par=>{ let line='';
    par.split(' ').forEach(word=>{ const t=line?line+' '+word:word; if(textW(t)>maxW && line){ out.push(line); line=word; } else line=t; });
    out.push(line); }); return out;
}
// ================= ÁUDIO (sem ruído: só timbres tonais, suaves) =================
const AU = { ctx:null, master:null, music:null, sfx:null, on:true, track:null, step:0, nextT:0, pending:null, trackName:null };
function audioInit(){
  if (AU.ctx) { if (AU.ctx.state==='suspended') AU.ctx.resume(); return; }
  try {
    const A = new (window.AudioContext||window.webkitAudioContext)(); AU.ctx=A;
    AU.master=A.createGain(); AU.master.gain.value=0.9;
    const lp=A.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=7000; lp.Q.value=0.3;
    const comp=A.createDynamicsCompressor(); comp.threshold.value=-20; comp.knee.value=20; comp.ratio.value=3; comp.attack.value=0.01; comp.release.value=0.25;
    AU.master.connect(lp); lp.connect(comp); comp.connect(A.destination);
    AU.music=A.createGain(); AU.music.gain.value=0.5; AU.music.connect(AU.master);
    AU.sfx=A.createGain(); AU.sfx.gain.value=0.45; AU.sfx.connect(AU.master);
    // reverb suave (resposta gerada com senoides decaindo, sem chiado audível)
    AU.verb=A.createConvolver(); const len=Math.floor(A.sampleRate*2.6), ir=A.createBuffer(2,len,A.sampleRate);
    for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); let v=0; for(let i=0;i<len;i++){ v=v*0.6+(Math.random()*2-1)*0.4; d[i]=v*Math.pow(1-i/len,3.2)*0.6; } }
    AU.verb.buffer=ir; const vlp=A.createBiquadFilter(); vlp.type='lowpass'; vlp.frequency.value=2600;
    AU.verbG=A.createGain(); AU.verbG.gain.value=0.28; AU.verb.connect(vlp); vlp.connect(AU.verbG); AU.verbG.connect(AU.master);
    // ecos (delay) para dar profundidade
    AU.dly=A.createDelay(1); AU.dly.delayTime.value=0.33; const fb=A.createGain(); fb.gain.value=0.28; const dlp=A.createBiquadFilter(); dlp.frequency.value=1800;
    AU.dly.connect(dlp); dlp.connect(fb); fb.connect(AU.dly); AU.dlyG=A.createGain(); AU.dlyG.gain.value=0.22; dlp.connect(AU.dlyG); AU.dlyG.connect(AU.master);
    setInterval(schedMusic,25);
  } catch(e){ AU.ctx=null; }
}
const NOTE_I={c:0,'c#':1,db:1,d:2,'d#':3,eb:3,e:4,f:5,'f#':6,gb:6,g:7,'g#':8,ab:8,a:9,'a#':10,bb:10,b:11};
function nf(n){ const m=n.match(/^([a-g](?:#|b)?)(\d)$/); if(!m) return 0; return 440*Math.pow(2,(NOTE_I[m[1]]+(+m[2]+1)*12-69)/12); }
// envelope sem estalos: sempre termina em zero antes de parar o oscilador
function adsr(g,t,a,peak,dec,sus,dur,rel){ const p=g.gain; p.cancelScheduledValues(t); p.setValueAtTime(0,t); p.linearRampToValueAtTime(peak,t+a); p.linearRampToValueAtTime(peak*sus,t+a+dec); p.setValueAtTime(peak*sus,t+Math.max(a+dec,dur)); p.linearRampToValueAtTime(0,t+Math.max(a+dec,dur)+rel); return t+Math.max(a+dec,dur)+rel+0.05; }
function send(g,verb,dly){ const A=AU.ctx; if(verb){ const s=A.createGain(); s.gain.value=verb; g.connect(s); s.connect(AU.verb); } if(dly){ const s=A.createGain(); s.gain.value=dly; g.connect(s); s.connect(AU.dly); } }
function osc(type,f,t,end,dest,detune=0){ const o=AU.ctx.createOscillator(); o.type=type; o.frequency.value=f; o.detune.value=detune; o.connect(dest); o.start(t); o.stop(end); return o; }
function playInst(inst,freq,t,dur,vol=1,dest){
  const A=AU.ctx; if(!A) return; dest=dest||AU.music;
  const g=A.createGain(); g.connect(dest);
  switch(inst){
    case 'lead': { // flauta/ocarina: triângulo + senoide, vibrato suave atrasado
      const lp=A.createBiquadFilter(); lp.frequency.value=2400; lp.connect(g);
      const end=adsr(g,t,0.03,0.11*vol,0.15,0.75,dur,0.18);
      const o1=osc('triangle',freq,t,end,lp), o2=osc('sine',freq*2,t,end,lp); const g2=A.createGain(); g2.gain.value=0.15; o2.disconnect(); o2.connect(g2); g2.connect(lp);
      const v=A.createOscillator(), vg=A.createGain(); v.frequency.value=5; vg.gain.setValueAtTime(0,t); vg.gain.linearRampToValueAtTime(freq*0.006,t+0.35); v.connect(vg); vg.connect(o1.frequency); v.start(t); v.stop(end);
      send(g,0.35,0.25); break; }
    case 'chip': { // pulso suave e filtrado (lembra 8-bit, sem aspereza)
      const lp=A.createBiquadFilter(); lp.frequency.value=1500; lp.Q.value=0.2; lp.connect(g);
      const end=adsr(g,t,0.01,0.05*vol,0.12,0.55,dur,0.08); osc('square',freq,t,end,lp); osc('triangle',freq,t,end,lp);
      send(g,0.25,0.15); break; }
    case 'piano': { // e-piano FM (senoides)
      const end=t+Math.min(3,dur+1.6); const car=A.createOscillator(); car.frequency.value=freq; const mod=A.createOscillator(); mod.frequency.value=freq*2; const mg=A.createGain();
      mg.gain.setValueAtTime(freq*1.2,t); mg.gain.exponentialRampToValueAtTime(freq*0.05,t+0.6); mod.connect(mg); mg.connect(car.frequency); car.connect(g);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.14*vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.03*vol,t+0.8); g.gain.linearRampToValueAtTime(0,end-0.05);
      car.start(t); mod.start(t); car.stop(end); mod.stop(end); send(g,0.45,0.2); break; }
    case 'box': { const end=t+2.2; [[1,1],[2,0.28],[3.01,0.06]].forEach(([h,a])=>{ const gg=A.createGain(); gg.gain.value=a; gg.connect(g); osc('sine',freq*h,t,end,gg); });
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.16*vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.002,t+2); g.gain.linearRampToValueAtTime(0,end-0.02); send(g,0.6,0.3); break; }
    case 'pad': { const lp=A.createBiquadFilter(); lp.frequency.value=1100; lp.connect(g);
      const a=Math.min(0.8,dur*0.35); const end=adsr(g,t,a,0.045*vol,0.2,0.85,dur,0.9);
      osc('triangle',freq,t,end,lp,-6); osc('triangle',freq,t,end,lp,6); osc('sine',freq*0.5,t,end,lp); send(g,0.7,0); break; }
    case 'strings': { const lp=A.createBiquadFilter(); lp.frequency.value=1600; lp.connect(g);
      const end=adsr(g,t,Math.min(0.5,dur*0.3),0.05*vol,0.2,0.8,dur,0.6); osc('sawtooth',freq,t,end,lp,-5); osc('sawtooth',freq,t,end,lp,5); send(g,0.6,0); break; }
    case 'bass': { const lp=A.createBiquadFilter(); lp.frequency.value=700; lp.connect(g);
      const end=adsr(g,t,0.01,0.26*vol,0.15,0.7,dur*0.9,0.08); osc('triangle',freq,t,end,lp); osc('sine',freq,t,end,lp); break; }
    case 'kick': { const o=A.createOscillator(); o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(42,t+0.15); o.connect(g);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.45*vol,t+0.004); g.gain.exponentialRampToValueAtTime(0.002,t+0.28); g.gain.linearRampToValueAtTime(0,t+0.3); o.start(t); o.stop(t+0.32); break; }
    case 'tom': { const o=A.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(110,t+0.12); o.connect(g);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.16*vol,t+0.003); g.gain.exponentialRampToValueAtTime(0.002,t+0.16); g.gain.linearRampToValueAtTime(0,t+0.18); o.start(t); o.stop(t+0.2); break; }
    case 'tick': { const o=A.createOscillator(); o.type='sine'; o.frequency.value=2600; o.connect(g);

// cabeça: 10x10 unidades, s = escala. facing 1 dir, -1 esq, 0 frente
function drawHead(c,ox,oy,s,L,expr='n',facing=1,blink=false,t=0){
  const M=(lx,ly,w,h,col)=>{ const x= facing<0? ox+(10-lx-w)*s : ox+lx*s; c.fillStyle=col; c.fillRect(Math.round(x),Math.round(oy+ly*s),Math.round(w*s),Math.round(h*s)); };
  const sk=L.skin, skD=shade(L.skin,-0.18), skL=shade(L.skin,0.15), hr=L.hair, hrD=shade(L.hair,-0.3), hrL=shade(L.hair,0.25);
  const front = facing===0;
  // cabelo de trás (longo)
  if(L.hs==='long'){ M(0,1,4,13,hrD); M(1,1,8,3,hr); if(front){ M(0,1,10,12,hrD); } }
  if(L.veil){ M(-1,0,4,15,'#ffffffb0'); }
  // rosto
  M(1,2,8,7,sk); M(2,9,6,1,sk); M(1,2,1,7,skD); M(2,9,2,1,skD);
  if(!front){ M(9,4,1,3,sk); M(9,6,1,1,skD); M(8,3,1,1,skL); }
  else { M(1,2,8,7,sk); M(1,2,1,7,skD); M(8,2,1,7,skD); M(4,6,2,1,skD); }
  if(L.kid){ M(1,1,8,1,sk); }
  // orelha
  if(!front){ M(3,5,2,2,skD); M(3,6,1,1,shade(L.skin,-0.32)); }
  // olhos
  const eyeC=L.eye;
  const eyes = front? [2,6] : [7];
  eyes.forEach(ex=>{
    if(blink || expr==='closed'){ M(ex,6,front?2:1,1,shade(sk,-0.35)); }
    else if(expr==='happy'){ M(ex,5,front?2:1,1,eyeC); M(ex-(front?0:1),6,1,1,shade(sk,-0.2)); }
    else { M(ex,4,front?2:1,2,eyeC); if(s>=3) M(ex+(front?1:0),4,0.34,0.34,'#ffffff'); }
    if(expr==='cry'||expr==='tear'){ M(ex,6,1,2+(Math.floor(t*4)%2),'#8fd0ff'); }
  });
  // sobrancelhas
  const bc=hrD;
  if(expr==='angry'){ if(front){M(2,3,2,1,bc);M(6,3,2,1,bc);M(3,4,1,0.5,bc);M(6,4,1,0.5,bc);} else {M(6,3,2,1,bc);M(7,4,1,0.5,bc);} }
  else if(expr==='sad'||expr==='cry'){ if(front){M(2,3,2,1,bc);M(6,3,2,1,bc);M(2,2.6,1,0.5,bc);M(7,2.6,1,0.5,bc);} else M(6,3,2,1,bc); }
  else if(expr==='shock'){ if(front){M(2,2,2,1,bc);M(6,2,2,1,bc);} else M(6,2,2,1,bc); }
  else { if(front){M(2,3,2,1,bc);M(6,3,2,1,bc);} else M(6,3,2,1,bc); }
  // nariz/boca
  const mc=shade(L.skin,-0.45);
  const mx = front?4:7;
  if(expr==='happy'){ M(mx-(front?1:1),7,1,1,mc); M(mx,8,2,1,mc); if(front) M(mx+2,7,1,1,mc); }
  else if(expr==='smile'){ M(mx,8,2,1,mc); M(front?mx-1:mx-1,7,1,1,mc); }
  else if(expr==='shock'){ M(mx,7,2,2,'#4a1a1a'); }
  else if(expr==='sad'||expr==='cry'){ M(mx,8,2,1,mc); M(front?mx-1:mx-1,9,1,0.5,mc); if(front) M(mx+2,9,1,0.5,mc); }
  else if(expr==='angry'){ M(mx-(front?0:1),8,3,1,mc); }
  else if(expr==='talk'){ M(mx,(Math.floor(t*10)%2)?7:8,2,(Math.floor(t*10)%2)?2:1,mc); }
  else M(mx,8,2,1,mc);
  if(front && L.female){ M(2,7,1,1,'#f0a0a0a0'); M(7,7,1,1,'#f0a0a0a0'); }
  if(L.stache){ M(front?3:6,7,front?4:4,1,'#e8e8e8'); }
  if(L.glasses){ if(front){ M(1,4,4,2,'#ffffff30'); M(5,4,4,2,'#ffffff30'); M(1,4,8,0.5,'#222'); } else { M(6,4,3,2,'#ffffff30'); M(6,4,4,0.5,'#222'); } }
  // cabelo
  const hs=L.kid?(L.pig?'long':'short'):L.hs;
  if(hs==='short'){ M(1,0,8,2,hr); M(0,1,3,5,hr); M(8,1,2,1,hr); M(3,0,3,1,hrL); M(1,2,2,1,hr); M(0,5,2,1,hrD); if(front){ M(0,1,10,2,hr); M(0,1,2,5,hr); M(8,1,2,5,hr);} }
  else if(hs==='fringe'){ M(1,0,8,2,hr); M(0,1,3,6,hr); M(5,2,5,1,hr); M(8,2,2,2,hr); M(3,0,4,1,hrL); if(front){ M(0,1,10,3,hr); M(0,1,2,6,hr); M(8,1,2,6,hr); M(3,3,4,1,hr);} }
  else if(hs==='long'){ M(1,0,8,2,hr); M(0,1,3,8,hr); M(5,2,5,1,hr); M(3,0,4,1,hrL); M(8,2,2,2,hr); if(front){ M(0,1,10,3,hr); M(0,1,2,11,hr); M(8,1,2,11,hr); M(4,0,3,1,hrL);} }
  else if(hs==='messy'){ M(1,0,8,2,hr); M(0,1,3,5,hr); M(1,-1,2,1,hr); M(4,-1,2,1,hr); M(7,-1,1,1,hr); M(7,2,3,1,hr); M(3,0,3,1,hrL); if(front){ M(0,1,10,2,hr); M(0,1,2,5,hr); M(8,1,2,5,hr); M(3,2,4,1,hr);} }
  else if(hs==='bald'){ M(0,3,2,3,hr); M(2,1,6,1,skL); }
  if(L.pig){ M(-1,3,2,3,hr); if(front) M(9,3,2,3,hr); M(0,3,1,1,'#f06a8a'); }
}
// corpo: (x,y) = centro dos pés
function drawPerson(c,x,y,L,o={}){
  const f=o.facing??1, t=o.t||0, anim=o.anim||'idle';
  x=Math.round(x); y=Math.round(y);
  if(L.kid) return drawKid(c,x,y,L,o);
  const M=(dx,dy,w,h,col)=>{ const X=f>=0? x+dx : x-dx-w; c.fillStyle=col; c.fillRect(X,y+dy,w,h); };
  const pD=shade(L.pants,-0.25), sD=shade(L.shirt,-0.2), sL=shade(L.shirt,0.18);
  const run=anim==='run', walk=anim==='walk'||run;
  const ph = t*(run?16:10);
  let la = walk? Math.round(Math.sin(ph)*(run?3:2)) : 0;
  let bob = walk? (Math.abs(Math.sin(ph))>0.7?-1:0) : (anim==='idle'? (Math.sin(t*2)>0.6?0:0):0);
  const sl = L.slump?1:0;
  const yo=bob+sl;
  // sombra no chão
  c.fillStyle='rgba(0,0,0,0.28)'; c.fillRect(x-6,y-1,13,2);
  if(anim==='sit'){
    M(-3,-12,9,4,L.pants); M(-3,-12,9,1,shade(L.pants,0.12)); M(4,-9,3,8,pD); M(4,-2,5,2,L.shoes);
    M(-4,-22,8,11,L.shirt); M(-4,-22,2,11,sD);
    if(L.tie){ M(0,-22,3,1,'#e8eef2'); M(1,-21,1,6,L.tie); }
    if(o.type){ const k=Math.floor(t*8)%2; M(1,-19,6,3,sD); M(6,-17+k,2,2,L.skin); }
    else { M(-1,-21,3,7,sD); M(-1,-14,3,2,L.skin); }
    M(-1,-23,3,1,shade(L.skin,-0.2));
    drawHead(c, x-5+(f<0?0:0), y-33+(L.slump?2:0), 1, L, o.expr||'n', f, o.blink, t);
    return;
  }
  // pernas
  if(L.female && L.skirt){
    M(-3+la*0,-8,2,6,L.pants); M(1,-8,2,6,shade(L.pants,-0.1));
    M(-3-la,-2,4,2,L.shoes); M(0+la,-2,4,2,L.shoes);
    M(-5,-13+yo,10,6,L.skirt); M(-5,-13+yo,2,6,shade(L.skirt,-0.2)); M(-5,-8+yo,10,1,shade(L.skirt,-0.15));
  } else {
    M(-3-la,-11,3,9,pD); M(-3-la,-2,4,2,shade(L.shoes,-0.15));
    M(0+la,-11,3,9,L.pants); M(0+la,-2,5,2,L.shoes); M(0+la,-11+yo,3,1,shade(L.pants,0.1));
  }
  // tronco
  const tw=L.female?8:8, tx=-4;
  M(tx,-21+yo,tw,10,L.shirt); M(tx,-21+yo,2,10,sD); M(tx+tw-2,-20+yo,1,7,sL);
  if(L.belly){ M(tx+tw-1,-17+yo,2,5,L.shirt); }
  if(L.coat){ M(tx,-21+yo,tw,13,L.shirt); M(tx,-21+yo,2,13,sD); M(1,-21+yo,1,13,sD); }
  if(L.hood){ M(-4,-22+yo,5,2,sD); M(-2,-15+yo,6,1,sD); M(1,-20+yo,1,3,'#c8d0dc'); }
  if(L.tie){ M(0,-21+yo,3,1,'#e8eef2'); M(1,-20+yo,1,6,L.tie); M(1,-15+yo,2,1,L.tie); }
  if(!L.female && !L.coat) M(tx,-12+yo,tw,1,shade(L.pants,-0.35));
  if(L.female && !L.skirt) M(tx,-12+yo,tw,1,shade(L.shirt,-0.3));
  // braço
  if(anim==='raise'){
    M(0,-21+yo,5,3,sD); M(4,-27+yo,3,7,sD); M(4,-28+yo,3,2,L.skin);
    const gl=0.5+0.5*Math.sin(t*12); M(4,-24+yo,3,2,'#f2c45a'); M(5,-24+yo,1,1,gl>0.5?'#fff6c0':'#ffe080');
  } else if(anim==='hold'){ // segurando algo à frente
    M(0,-20+yo,6,3,sD); M(5,-19+yo,2,2,L.skin);
  } else if(anim==='hug'){
    M(0,-20+yo,7,3,sD); M(6,-20+yo,2,3,L.skin);
  } else {
    const sw= walk? Math.round(-Math.sin(ph)*(run?3:2)) : 0;
    M(-1+sw,-20+yo,3,7,sD); M(-1+sw,-13+yo,3,2,L.skin);
    if(o.watch){ M(-1+sw,-14+yo,3,1,'#c99a3a'); }
  }
  M(-1,-22+yo,3,1,shade(L.skin,-0.2));
  drawHead(c,x-5,y-32+yo+(L.slump?1:0),1,L,o.expr||'n',f,o.blink,t);
}
function drawKid(c,x,y,L,o){
  const f=o.facing??1,t=o.t||0,anim=o.anim||'idle'; const walk=anim==='walk'||anim==='run';
  const M=(dx,dy,w,h,col)=>{ const X=f>=0? x+dx : x-dx-w; c.fillStyle=col; c.fillRect(X,y+dy,w,h); };
  const la= walk? Math.round(Math.sin(t*14)*2):0; const hop = anim==='jump'? -Math.abs(Math.round(Math.sin(t*8)*3)) : 0;
  c.fillStyle='rgba(0,0,0,0.28)'; c.fillRect(x-4,y-1,9,2);
  M(-2-la,-5+hop,2,4,shade(L.pants,-0.2)); M(1+la,-5+hop,2,4,L.pants); M(-2-la,-1+hop,3,1,L.shoes); M(1+la,-1+hop,3,1,L.shoes);
  M(-3,-11+hop,6,7,L.shirt); M(-3,-11+hop,2,7,shade(L.shirt,-0.2));
  M(0,-10+hop,2,4,shade(L.shirt,-0.15)); M(0,-6+hop,2,1,L.skin);
  const s=0.8; drawHead(c,x-4,y-19+hop,s,L,o.expr||'happy',f,o.blink,t);
}

function drawPortrait(c,x,y,who,expr,t,talking){
  const P=PORTRAIT[who]; if(!P) return false;
  const L=P.look();
  // moldura
  R(c,x-2,y-2,36,36,'#0b0912'); R(c,x-1,y-1,34,34,P.col); R(c,x,y,32,32,'#1a1626');
  vgrad(c,x,y,32,32,[[0,shade(P.col,-0.55)],[1,'#120f1c']]);
  dith(c,x,y+24,32,8,'#00000040');
  c.save(); c.beginPath(); c.rect(x,y,32,32); c.clip();
  const bl = (t%3.2)<0.12;
  if(who==='Miguel'){ c.globalCompositeOperation='lighter'; circ(c,x+16,y+16,15,'#3a3420'); c.globalCompositeOperation='source-over'; }
  // ombros
  const sh = L.shirt||'#444'; R(c,x+4,y+28,24,6,sh); R(c,x+4,y+28,6,6,shade(sh,-0.2));
  if(L.tie){ R(c,x+15,y+28,3,6,L.tie); }
  drawHead(c,x+1,y+1,3,L,talking&&expr!=='shock'&&expr!=='cry'?(expr==='n'?'talk':expr):expr,1,bl&&expr!=='closed',t);
  c.restore();
  // cantos ornamentados
  [[x-2,y-2],[x+31,y-2],[x-2,y+31],[x+31,y+31]].forEach(([a,b])=>{ R(c,a,b,3,3,'#f2c45a'); R(c,a+1,b+1,1,1,'#fff3c0'); });
  return true;
}

  if(ok){ actor('pedro').y-=6; actor('pedro').expr='n'; sfx('door'); await say('Lucas','Segurei! Vem!',{expr:'shock'}); await Promise.all([walk('lucas',14,90,'run'),walk('pedro',14,90,'run')]); G.flags.pedroAlive=true; }
  else { G.flash=0.6; sfx('crash'); rmActor('pedro'); G.flags.pedroAlive=false; await say('Lucas','PEDRO!!!',{expr:'cry'}); await think('O relógio... parado. Como a casa inteira.'); await walk('lucas',14,90,'run'); }
  G.flags.pedroDone=true; G.flags.dirSad = G.flags.pedroAlive===false; G.flags.momSad = G.flags.pedroAlive===false;
  await fade(1,0.8,'#fff');
  // amanhecer
  setScene(SCENES.mansao('fora')); sc().ambient='rgba(60,30,40,0.25)'; sc().rain=0; G.fx.tint=['soft-light','rgba(255,170,120,0.4)']; ambRain(0);
  mkLucas(150,LOOKS.lucas05,{watch:true}); G.camLock=0; G.lantern=false; addActor('diretor',LOOKS.diretor,260,{facing:-1}); playMusic(G.flags.pedroAlive?'amor':'luto');
  if(G.flags.pedroAlive) addActor('pedro',LOOKS.pedro,170,{facing:1});
  await fade(0,1.2,'#fff');
  if(G.flags.pedroAlive){ await narr('Amanhecer.',2);
    await say('Diretor','LUCAS! PEDRO! Graças a Deus!',{expr:'shock'}); await walk('diretor',190,60);
    await say('Diretor','A gente procurou a noite inteira... a polícia, os professores...',{expr:'cry'});
    await say('Pedro','Foi o Lucas, diretor. Ele não soltou a minha mão. Nem quando o chão abriu.',{expr:'happy'});
    await say('Diretor','Lucas... você deveria ter me chamado.',{expr:'n'});
    await say('Diretor','Mas eu nunca senti tanto orgulho de alguém na minha vida.',{expr:'cry'});
    await say('Pedro','A gente é amigo agora, né, Lucas?',{expr:'happy'}); await say('Lucas','A gente é amigo pra sempre, Pedro.',{expr:'happy'});
    await think('Lá no alto, numa janela da casa, por um segundo, uma menina acenou.'); }
  else { await narr('Amanhecer.',2);
    await walk('diretor',180,40); await say('Diretor','Lucas... cadê o Pedro?',{expr:'shock'});
    await say('Lucas','Eu tentei... eu juro que eu tentei...',{expr:'cry'});
    await say('Diretor','Por que você não me chamou? Eu PEDI. Eu pedi pra você...',{expr:'cry'});
    await say('Diretor','...Vai pra casa, Lucas. Sua mãe está te procurando a noite toda.',{expr:'sad'});
    await narr('Pedro não voltou para casa.',3,{col:'#c8c0d8'});
    await think('Eu voltei no tempo pra ser feliz. E não consegui salvar nem um menino de onze anos.'); }
  G.fx.tint=null; await fade(1,1);
}
async function porao(){
  setScene(SCENES.mansao('porao')); mkLucas(150,LOOKS.lucas05,{watch:true}); addActor('pedro',LOOKS.pedro,134,{facing:1}); G.camLock=0;
  await fade(0,0.6); const f=G.flags.pedro;
  if(G.flags.pedroBox){ // entregando a caixinha
    addActor('alice',LOOKS.alice,230,{facing:-1,ghost:true,float:true,glow:0.8}); await ghostIn('alice',1,0.8);
    await say('Lucas','A sua caixinha. Achei lá em cima.',{expr:'smile'}); sfx('sparkle');
    playMusic('silencio'); bg(async()=>{ const mel=['e5','g5','c6','b5','g5','e5','d5','c5','e5','g5','a5','g5']; for(const n of mel){ playInst('box',nf(n),AU.ctx?AU.ctx.currentTime:0,0.5,1.1); await wait(0.42); } });
    await say('Alice','A musiquinha do meu irmão...',{expr:'happy'});
    await say('Alice','Ele se perdeu aqui em 1952. Ninguém veio buscar ele. Eu fiquei esperando.',{expr:'sad'});
    await say('Alice','Mas você veio buscar o seu amigo. Ninguém nunca fez isso nesta casa.',{expr:'happy'});
    await say('Alice','A porta está aberta. Corram... a casa não vai aguentar sem mim.',{expr:'n'});
    await ghostOut('alice',1.4); G.flags.pedroBoxDone=true; return; }
  if(G.flags.pedroGhostMet){ await think('Ela está esperando a caixinha. Está lá no sótão.'); await say('Pedro','Vamos logo, Lucas...',{expr:'sad'}); await fade(1,0.5); return; }
  G.flags.pedroGhostMet=true;
  await wait(0.8); playMusic('assombrada');
  await say(null,'(Uma musiquinha de caixinha... e um choro baixinho.)');
  addActor('alice',LOOKS.alice,260,{facing:-1,ghost:true,float:true,glow:0.8}); await ghostIn('alice',1.2,0.8); sfx('glitch'); G.shake=0.5;
  await say('Pedro','É ELA!',{expr:'cry'});
  const g=await choice('O fantasma avança!',['Ficar na frente do Pedro','Correr!'],{time:4,id:'o fantasma'});
  if(g===0){ f.trust++; actor('lucas').facing=1; await walk('lucas',190,60); await say('Lucas','Fica atrás de mim, Pedro!',{expr:'angry'}); }
  else { f.risk++; await walk('lucas',30,90,'run'); await say('Pedro','LUCAS, ESPERA! Eu caí!',{expr:'cry'}); f.trust--; await walk('lucas',140,60); }
  await walk('alice',230,10);
  await say('Alice','Vocês viram o meu irmão?',{expr:'sad'});
  await say('Alice','Ele dormia com uma caixinha de música. Tocava toda noite. Agora tá lá em cima, trancada no sótão... eu não consigo subir.',{expr:'sad'});
  await say('Alice','Tragam pra mim. Por favor.',{expr:'sad'});
  addClue('alice','O fantasma é Alice Moraes. Ela quer a caixinha de música do irmão, que está no sótão.');
  await ghostOut('alice',1);
  await say('Pedro','Ela... não parecia malvada. Parecia triste.',{expr:'sad'});
  await fade(1,0.5);
}
async function sotao(){
  await fade(1,0.4); setScene(SCENES.mansao('sotao')); mkLucas(30,LOOKS.lucas05,{watch:true}); addActor('pedro',LOOKS.pedro,16); startFollow('pedro'); G.camLock=0; sfx('door');
  await fade(0,0.5); await think('O sótão. Poeira e brinquedos velhos.'); const f=G.flags.pedro;
  while(true){ const id=await free([{x:60,label:'Baú',id:'bau'},{x:120,label:'Cavalinho',id:'cav'},{x:220,label:'Guarda-roupa',id:'gr'},{x:280,label:'Estante alta',id:'est'}]);
    if(id==='bau') await think('Roupas de criança, um pião, bolinhas de gude. Nada de caixinha.');
    if(id==='cav'){ await think('Ele balança sozinho. Melhor não pensar nisso.'); }
    if(id==='gr'){ sfx('slam'); G.shake=0.4; await say('Pedro','AAAH! ...Era um gato. Era só um gato.',{expr:'shock'}); }
    if(id==='est'){ await think('Lá no alto! Uma caixinha dourada. Mas a estante tá podre...');
      const c=await choice('Como pegar?',['Eu subo, mesmo rangendo','Pedro sobe, ele é mais leve','Arrastar o baú e usar de degrau'],{time:0,silence:false,id:'pegar a caixinha'});
      stopFollow();
      if(c===2){ await say('Lucas','Me ajuda com o baú, Pedro.',{expr:'smile'}); sfx('door'); await wait(0.6); await say('Pedro','Boa ideia! Assim ninguém cai.',{expr:'happy'}); f.trust++; }
      else if(c===0){ sfx('crash'); G.shake=0.8; await say('Lucas','Ai! A prateleira quebrou! ...Tô bem, tô bem.',{expr:'shock'}); }
      else { if(f.trust>=2){ await say('Lucas','Sobe. Eu seguro a estante. Confia em mim.',{expr:'smile'}); await say('Pedro','Eu confio.',{expr:'happy'}); f.trust++; }
        else { f.risk++; sfx('crash'); G.shake=0.8; await say('Pedro','AI! Eu caí! Meu braço...',{expr:'cry'}); await say('Lucas','Desculpa, Pedro! Eu devia ter segurado!',{expr:'shock'}); } }
      sc().state.box=true; sfx('sparkle'); await think('A caixinha de música!'); G.flags.pedroBox=true; startFollow('pedro'); break; }
  }
  await fade(1,0.4);
}
requestAnimationFrame(loop);
